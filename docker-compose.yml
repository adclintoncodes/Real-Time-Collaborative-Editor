services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: collab-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - collab-net

  cassandra:
    image: cassandra:4.1
    container_name: collab-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: CollabCluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: SimpleSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - ./server/src/db/schema.cql:/docker-entrypoint-initdb.d/schema.cql:ro
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - collab-net

  cassandra-init:
    image: cassandra:4.1
    container_name: collab-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./server/src/db/schema.cql:/schema.cql:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        echo "Applying Cassandra schema..."
        for i in $(seq 1 30); do
          if cqlsh cassandra -f /schema.cql; then
            echo "Schema applied successfully."
            exit 0
          fi
          echo "Attempt $$i failed; retrying in 5s..."
          sleep 5
        done
        echo "Failed to apply schema after retries."
        exit 1
    networks:
      - collab-net
    restart: "no"

networks:
  collab-net:
    driver: bridge

volumes:
  cassandra-data:
